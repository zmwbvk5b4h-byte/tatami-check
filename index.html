
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たたみ機メンテナンス">
<meta name="theme-color" content="#8060b5">
<link rel="apple-touch-icon" href="icon.png">
<title>たたみ機メンテナンス</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f5f0fb;color:#393044;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{text-align:center;margin-bottom:14px}
h1{font-size:21px;color:#73539f;margin:8px 0}
.sub{font-size:12px;color:#82758f}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
button{border:0;border-radius:10px;padding:11px 8px;font-size:14px;font-weight:600}
.tab{background:#e6dcef;color:#614a7e}
.tab.active{background:#8060b5;color:white}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tool{flex:1;min-width:42%;background:white;color:#71538e;border:1px solid #dfd2ed}
.save{background:#8060b5;color:white;border:0}
.sheet{background:white;border-radius:12px;padding:12px 8px}
.sheet h2{text-align:center;font-size:18px;color:#73539f;margin:5px 0 14px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
th,td{border:1px solid #d9cfe3;padding:8px 5px;overflow-wrap:anywhere}
th{background:#eee6f7;color:#60477e}
th:first-child{width:57%}
th:last-child{width:43%}
.status{width:100%;min-width:0;border:0;outline:0;background:transparent;text-align:center;font-size:15px;color:#393044;padding:4px 0}
.status:focus,.memo:focus{background:#faf6ff}
.hint{text-align:center;font-size:11px;color:#887b94;margin:12px 0}
.memo-title{font-size:14px;font-weight:bold;color:#73539f;margin:14px 0 6px}
.memo{width:100%;min-height:80px;resize:vertical;border:1px solid #d9cfe3;border-radius:8px;padding:9px;font:inherit;font-size:14px}
.footer{text-align:center;font-size:11px;color:#9588a0;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>たたみ機メンテナンス</h1>
<div class="sub">点検したら「○」を記入</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="toolbar">
<button class="tool save" onclick="savePageAsImage()">保存</button>
<button class="tool" onclick="clearCurrent()">このページをリセット</button>
<button class="tool" onclick="clearAll()">全部リセット</button>
</div>
<div class="sheet" id="sheet">
<h2 id="sheetTitle"></h2>
<table>
<thead><tr><th>点検項目</th><th>済記入欄</th></tr></thead>
<tbody id="checklist"></tbody>
</table>
<div class="hint">空欄をタップすると「○」が入ります</div>
<div class="memo-title">メモ・備考</div>
<textarea class="memo" id="memo" placeholder="気づいたことなどを入力"></textarea>
<div class="footer">たたみ機メンテナンス記録</div>
</div>
<script>
const machines=["たたみ直し機","スパート１番線","スパート２番線","スパート３番線"];
const items=["モーター点検","変速機点検","Ｖベルト点検","ピローブロック点検","ローラーチェーン点検","スプロケット点検","アイドラスプロケット点検（テンション張り）","ベアリング点検","クランク点検","生地折り込みバー用ゴム車輪点検","生地抑え板点検"];
const KEY="tatami_check_complete_v2";
let current=0,data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){data={}}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("保存できませんでした")}}
function ensurePage(i){const k=String(i);if(!data[k])data[k]={checks:items.map(()=>"") ,memo:""};if(!Array.isArray(data[k].checks))data[k].checks=items.map(()=>"");while(data[k].checks.length<items.length)data[k].checks.push("");if(typeof data[k].memo!=="string")data[k].memo=""}
function renderTabs(){const tabs=document.getElementById("tabs");tabs.innerHTML="";machines.forEach((name,i)=>{const b=document.createElement("button");b.className="tab"+(i===current?" active":"");b.textContent=name;b.onclick=()=>{current=i;render()};tabs.appendChild(b)})}
function render(){ensurePage(current);renderTabs();document.getElementById("sheetTitle").textContent=machines[current]+" メンテナンス内容";const tbody=document.getElementById("checklist");tbody.innerHTML="";items.forEach((item,i)=>{const tr=document.createElement("tr"),name=document.createElement("td"),td=document.createElement("td"),input=document.createElement("input");name.textContent=item;input.className="status";input.type="text";input.value=data[current].checks[i]||"";input.setAttribute("aria-label",item+"の済記入欄");input.addEventListener("click",()=>{if(input.value===""){input.value="○";data[current].checks[i]="○";saveData()}});input.addEventListener("input",()=>{data[current].checks[i]=input.value;saveData()});td.appendChild(input);tr.appendChild(name);tr.appendChild(td);tbody.appendChild(tr)});document.getElementById("memo").value=data[current].memo||""}
document.getElementById("memo").addEventListener("input",e=>{ensurePage(current);data[current].memo=e.target.value;saveData()});
function clearCurrent(){if(!confirm("このページの点検内容を全部消しますか？"))return;data[String(current)]={checks:items.map(()=>""),memo:""};saveData();render()}
function clearAll(){if(!confirm("4ページ全部の点検内容を消しますか？"))return;data={};saveData();render()}
async function savePageAsImage(){const win=window.open("about:blank","_blank");if(!win){alert("Safariで開き直して、もう一度保存を押してください");return}win.document.write("<p style='font-family:sans-serif;padding:20px'>画像を作成中…</p>");win.document.close();try{if(!window.html2canvas){await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const canvas=await window.html2canvas(document.getElementById("sheet"),{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});const img=canvas.toDataURL("image/png");win.document.open();win.document.write("<!DOCTYPE html><html lang='ja'><head><meta name='viewport' content='width=device-width,initial-scale=1'><title>点検表</title></head><body style='margin:0;background:#eee'><p style='font-family:sans-serif;font-size:14px;padding:10px'>画像を長押しして「写真に保存」を選んでね</p><img src='"+img+"' style='display:block;width:100%;height:auto;background:white'></body></html>");win.document.close()}catch(e){win.document.body.innerHTML="<p style='font-family:sans-serif;padding:20px'>画像を作成できませんでした。通信状態を確認して再試行してください。</p>"}}
render();
</script>
</body>
</html>
